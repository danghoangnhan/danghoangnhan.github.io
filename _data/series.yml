# Post series. Key matches the `series:` value in post front matter.
cnn-course:
  name: "Convolutional Neural Networks"
  description: >-
    Twenty-five notes on convolutional networks, in order — from the convolution
    operation itself through the classic architectures, ResNet, Inception,
    MobileNet and EfficientNet, ending with object detection and YOLO. Each part
    carries the arithmetic, a diagram and the papers it draws on.
