#Site
title: "Daniel's Blogs"
author: "Daniel Du"
description: "My personal blog, Creating for upload personal  research, coding related resource." # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.
name: "Daniel's Blogs"
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.png'

# Absolute site URL. GitHub Pages' legacy builder injected this automatically; a
# plain `jekyll build` (i.e. GitHub Actions) does not. jekyll-seo-tag,
# jekyll-sitemap and feed.xml all consume it.
url: "https://danghoangnhan.github.io"
# Empty (not "/") for a user page. "/" makes {{ site.baseurl }}/assets/... render
# as //assets/... — a protocol-relative URL pointing at a host named "assets".
baseurl: ""
lang: en

# `disqus:` removed — comments moved to giscus (see below). The old shortname was
# 'https-danghoangnhan-github-io'; restoring that key is all it takes to roll back,
# since _includes/comments.html still falls through to Disqus when giscus is unset.

include: ["_pages", "_redirects"]
permalink: /:title/

# Every post gets a language, so page.lang is always populated and templates do not
# each carry their own `| default:` chain. Override per post with `lang: vi` in front
# matter; the codes are the keys of _data/languages.yml and must stay valid BCP 47,
# because _layouts/default.html emits them verbatim as <html lang>.
#
# A post in another language should ALSO carry `locale: vi_VN` — jekyll-seo-tag
# derives og:locale from page.lang when no locale is given, and a bare "vi" is not a
# valid Open Graph locale. See the note in _data/languages.yml.
#
# Translations of one article additionally share a `ref:` key, which is what
# _includes/translations.html and _includes/hreflang.html match on.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: en
      # og:locale, not page.lang. jekyll-seo-tag resolves og:locale as
      # `page.locale || site.locale || page.lang`, and Open Graph wants
      # language_TERRITORY — a bare "en" is not a valid locale, so every page was
      # emitting an invalid one. A translated post overrides BOTH keys together
      # (`lang: vi` + `locale: vi_VN`); the values live in _data/languages.yml and
      # .github/workflows/ci.yml fails the build if a non-English post sets only
      # one of them.
      locale: en_US

# Authors moved to _data/authors.yml — that is the only place jekyll-seo-tag
# looks, and while they lived here every page shipped the slug "danghoangnhan"
# as the author name and as twitter:creator. See the note in that file.

# Email / Social media user names
email: "danghoangnhan.1@gmail.com"
twitter_username: "CallMeMrFern"
github_username: "danghoangnhan"
# Was "daniel-du-4734081b8", which disagreed with the `social:` list below and
# with the footer link in _layouts/default.html. danieldu2812 is the live profile.
linkedin_username: "danieldu2812"
facebook_username: teddddy.bearrrrr
instagram_username: teddddy.bearrrrr

# Consumed by jekyll-seo-tag. It does NOT read minima's flat `twitter_username`,
# so the nested form below is required for Twitter cards to be emitted.
twitter:
  username: CallMeMrFern
  card: summary_large_image

social:
  name: "Daniel Du"
  links:
    - https://twitter.com/CallMeMrFern
    - https://github.com/danghoangnhan
    - https://www.linkedin.com/in/danieldu2812
    - https://facebook.com/teddddy.bearrrrr

# og:image fallback for pages that have no `image:` in front matter.
image: assets/images/logo.png

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################

# Google Analytics 4. `_includes/google-analytics.html` iterates this, so it must
# be a list. Universal Analytics (UA-*) was shut down by Google in 2023 — do not
# re-add a UA property here.
#
# Left empty on purpose: with no entries this key is nil, the gate in
# _layouts/default.html is falsy, and no analytics script is emitted at all.
# Uncomment and set your G- measurement ID to switch tracking on.
google_analytics:
#  - G-XXXXXXXXXX

# The github repo used for looking up comments
comments_repo: danghoangnhan/danghoangnhan.github.io

# giscus (GitHub Discussions-backed comments). Active: _includes/comments.html
# switches to giscus once both ids are present, and falls back to the Disqus embed
# otherwise — so deleting either id below is a complete rollback.
#
# "Announcements" is GitHub's default announcement-format category, which is what
# giscus wants: only maintainers can open threads there, so readers cannot create
# discussions by visiting a post. Blog threads therefore share the category with
# any real announcements; move them to a dedicated Announcement-format category if
# that ever gets noisy.
#
# Both ids read from the GitHub API — repo_id from `GET /repos/{owner}/{repo}`,
# category_id from the GraphQL discussionCategories query.
giscus:
  repo: danghoangnhan/danghoangnhan.github.io
  category: Announcements
  repo_id: R_kgDOGfn8Uw
  category_id: DIC_kwDOGfn8U84DCdF8

# `titles_from_headings:` used to sit here. It configures jekyll-titles-from-headings,
# which is not in the Gemfile and never has been, so it did nothing — while the
# problem it was added for (18 posts opening their body with an <h1> that repeated
# the front-matter title) went unfixed for years. Those h1s are now removed from the
# Markdown itself, which is explicit, reviewable in the diff, and does not depend on
# a plugin silently rewriting titles at build time.

# Plugins
plugins:
  # jekyll-feed is NOT listed: its generator skips when a feed.xml already exists in
  # the source, and this repo hand-writes one (RSS 2.0 rather than the Atom the gem
  # emits). The gem has been inert since the day feed.xml was committed.
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-seo-tag

# Archives.
# NOTE: jekyll-archives is not on GitHub Pages' plugin allowlist, so this block is
# inert on the legacy builder and every /category/:name/ link 404s. It starts
# working once the build moves to GitHub Actions with this repo's own Gemfile.
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'

# Dependencies
markdown: kramdown
highlighter:      rouge

excerpt_separator: <!--more-->
