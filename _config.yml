#Site
title: "Daniel's Blogs"
author: "Daniel Du"
description: "My personal blog, Creating for upload personal  research, coding related resource." # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.
name: "Daniel's Blogs"
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.png'

# Absolute site URL. GitHub Pages' legacy builder injected this automatically; a
# plain `jekyll build` (i.e. GitHub Actions) does not. jekyll-seo-tag,
# jekyll-sitemap and feed.xml all consume it.
url: "https://danghoangnhan.github.io"
# Empty (not "/") for a user page. "/" makes {{ site.baseurl }}/assets/... render
# as //assets/... — a protocol-relative URL pointing at a host named "assets".
baseurl: ""
lang: en

# `disqus:` removed — comments moved to giscus (see below). The old shortname was
# 'https-danghoangnhan-github-io'; restoring that key is all it takes to roll back,
# since _includes/comments.html still falls through to Disqus when giscus is unset.

include: ["_pages", "_redirects"]

# Jekyll copies any unrecognised top-level directory into _site, so script/ was
# being published — /script/lint-content.rb served as part of the site. Build
# tooling is not content.
exclude:
  - script/
  - Gemfile
  - Gemfile.lock
  - Readme.md
  - LICENSE
  - .ruby-version
  - .pa11yci.json

permalink: /:title/

# Every post gets a language, so page.lang is always populated and templates do not
# each carry their own `| default:` chain. Override per post with `lang: vi` in front
# matter; the codes are the keys of _data/languages.yml and must stay valid BCP 47,
# because _layouts/default.html emits them verbatim as <html lang>.
#
# A post in another language should ALSO carry `locale: vi_VN` — jekyll-seo-tag
# derives og:locale from page.lang when no locale is given, and a bare "vi" is not a
# valid Open Graph locale. See the note in _data/languages.yml.
#
# Translations of one article additionally share a `ref:` key, which is what
# _includes/translations.html and _includes/hreflang.html match on.
defaults:
  # Everything, posts and pages alike. og:locale was scoped to `type: posts` at
  # first, which left the home page, /about, /list-100, /topics/, /archive/,
  # /404.html and every /category/ page still emitting the invalid bare "en".
  - scope:
      path: ""
    values:
      locale: en_US
  # KNOWN GAP: this does not reach the nine /category/ pages, which still emit the
  # bare `og:locale: en`. They are built by a generator that constructs its own
  # page objects and applies no front-matter defaults, so neither the scope above
  # nor a type-scoped one touches them — that was tried under jekyll-archives and
  # changed nothing, and jekyll-paginate-v2's autopages behaves the same way for
  # the same reason. Fixing it properly needs a _plugins/ hook, which is more
  # machinery than an Open Graph locale on a category listing is worth. Recorded
  # rather than papered over.
  - scope:
      path: ""
      type: posts
    values:
      lang: en
      # og:locale, not page.lang. jekyll-seo-tag resolves og:locale as
      # `page.locale || site.locale || page.lang`, and Open Graph wants
      # language_TERRITORY — a bare "en" is not a valid locale, so every page was
      # emitting an invalid one. A translated post overrides BOTH keys together
      # (`lang: vi` + `locale: vi_VN`); the values live in _data/languages.yml and
      # .github/workflows/ci.yml fails the build if a non-English post sets only
      # one of them.

# Authors moved to _data/authors.yml — that is the only place jekyll-seo-tag
# looks, and while they lived here every page shipped the slug "danghoangnhan"
# as the author name and as twitter:creator. See the note in that file.

# Email / Social media user names
email: "danghoangnhan.1@gmail.com"
twitter_username: "CallMeMrFern"
github_username: "danghoangnhan"
# Was "daniel-du-4734081b8", which disagreed with the `social:` list below and
# with the footer link in _layouts/default.html. danieldu2812 is the live profile.
linkedin_username: "danieldu2812"
facebook_username: teddddy.bearrrrr
instagram_username: teddddy.bearrrrr

# Consumed by jekyll-seo-tag. It does NOT read minima's flat `twitter_username`,
# so the nested form below is required for Twitter cards to be emitted.
twitter:
  username: CallMeMrFern
  card: summary_large_image

social:
  name: "Daniel Du"
  links:
    - https://twitter.com/CallMeMrFern
    - https://github.com/danghoangnhan
    - https://www.linkedin.com/in/danieldu2812
    - https://facebook.com/teddddy.bearrrrr

# og:image fallback for pages that have no `image:` in front matter.
image: assets/images/logo.png

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################

# Google Analytics 4. `_includes/google-analytics.html` iterates this, so it must
# be a list. Universal Analytics (UA-*) was shut down by Google in 2023 — do not
# re-add a UA property here.
#
# Left empty on purpose: with no entries this key is nil, the gate in
# _layouts/default.html is falsy, and no analytics script is emitted at all.
# Uncomment and set your G- measurement ID to switch tracking on.
google_analytics:
#  - G-XXXXXXXXXX

# The github repo used for looking up comments
comments_repo: danghoangnhan/danghoangnhan.github.io

# giscus (GitHub Discussions-backed comments). Active: _includes/comments.html
# switches to giscus once both ids are present, and falls back to the Disqus embed
# otherwise — so deleting either id below is a complete rollback.
#
# "Announcements" is GitHub's default announcement-format category, which is what
# giscus wants: only maintainers can open threads there, so readers cannot create
# discussions by visiting a post. Blog threads therefore share the category with
# any real announcements; move them to a dedicated Announcement-format category if
# that ever gets noisy.
#
# Both ids read from the GitHub API — repo_id from `GET /repos/{owner}/{repo}`,
# category_id from the GraphQL discussionCategories query.
giscus:
  repo: danghoangnhan/danghoangnhan.github.io
  category: Announcements
  repo_id: R_kgDOGfn8Uw
  category_id: DIC_kwDOGfn8U84DCdF8

# `titles_from_headings:` used to sit here. It configures jekyll-titles-from-headings,
# which is not in the Gemfile and never has been, so it did nothing — while the
# problem it was added for (18 posts opening their body with an <h1> that repeated
# the front-matter title) went unfixed for years. Those h1s are now removed from the
# Markdown itself, which is explicit, reviewable in the diff, and does not depend on
# a plugin silently rewriting titles at build time.

# Plugins
plugins:
  # jekyll-feed is NOT listed: its generator skips when a feed.xml already exists in
  # the source, and this repo hand-writes one (RSS 2.0 rather than the Atom the gem
  # emits). The gem has been inert since the day feed.xml was committed.
  - jekyll-sitemap
  - jekyll-paginate-v2
  - jekyll-seo-tag

# Pagination.
#
# This is jekyll-paginate-v2, not the v1 gem that used to be here. v1 populated
# paginator.posts straight from site.posts with no filter hook, so `hidden: true`
# posts had to be skipped inside the Liquid loop and the pages came out ragged
# (6, 4, 6, 5) — which is why pagination was dropped from the site entirely. v2
# rejects hidden documents in the generator, so paginator.posts is already the
# visible set and every page is full.
#
# `enabled: true` here only supplies the defaults. A page is paginated only when it
# opts in from its own front matter, which is what keeps /about, /topics/ and
# /archive/ out of it — see index.html.
#
# Not on GitHub Pages' plugin allowlist; works because this repo controls its own
# build via GitHub Actions.
pagination:
  enabled: true
  per_page: 6
  # These exact URLs were live until pagination was removed, so this restores them
  # rather than minting /page/2/ and leaving the old ones 404ing. It matches the
  # gem's code default; the README documents '/page/:num/' instead, so setting it
  # explicitly is what stops a future README-led edit from silently moving them.
  permalink: '/page:num/'
  # ':title' means "leave page.title alone", and it has to be said out loud: the
  # gem's own default is ':title - page :num', so omitting this key is NOT the same
  # as switching it off. That default broke two things at once — jekyll-seo-tag
  # already prefixes paginated pages itself, so the <title> came out "Page 2 of 4
  # for Home - page 2", and _layouts/archive.html renders page.title as its <h1>,
  # so category page 2 was headed "Posts tagged cnn - page 2". Titles are still
  # unique per page; seo-tag supplies the "Page 2 of 4 for" part.
  title: ':title'
  sort_field: 'date'
  # REQUIRED, and easy to miss: the generator sorts ascending and reverses only
  # when this is true, and it defaults to FALSE. Omit it and the home page opens
  # with the 2022 padding post instead of the newest one.
  sort_reverse: true
  # A window, not the full list: the control stays a fixed width as the blog grows.
  # Also required — both bounds default to 0, and at 0/0 the gem never builds
  # paginator.page_trail at all, so _includes/pagination.html renders no numbers.
  trail:
    before: 2
    after: 2

# Category archives, previously jekyll-archives.
#
# Swapped because both generators write the same /category/<name>/ permalinks and
# would collide, so only one of them can be installed. Autopages produces the same
# nine URLs and additionally paginates them through the block above.
autopages:
  enabled: true
  categories:
    layouts:
      - 'archive.html'
    # The bare category name, matching what jekyll-archives put in page.title.
    # _layouts/archive.html renders it as the <h1> and jekyll-seo-tag uses it as the
    # <title>; the ':title - page :num' suffix above is appended from page 2 on.
    title: ':cat'
    # The trailing slash is load-bearing. The plugin's own default is
    # '/category/:cat' with no slash, which writes category/cnn.html instead of
    # category/cnn/index.html and 404s all nine existing URLs.
    permalink: '/category/:cat/'
    slugify:
      mode: 'default'
      case: false
  # Both explicitly off. The plugin's README says omitting a block disables it; that
  # is not true of 3.0.0, which falls back to its built-in defaults and tries to
  # build the pages anyway — "AutoPages: Generating collections pages" followed by
  # four `Layout 'autopage_collection' requested` warnings, because the layout it
  # defaults to does not exist here. Only `enabled: false` actually stops them.
  #
  # Worth keeping off beyond the noise: the site has no tags, and tag autopages are
  # the one code path with a reported Errno::EEXIST crash under Jekyll 4 (upstream
  # issue #170).
  tags:
    enabled: false
  collections:
    enabled: false

# Dependencies
markdown: kramdown
highlighter:      rouge

excerpt_separator: <!--more-->
