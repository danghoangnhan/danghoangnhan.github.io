name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Publishes future-dated posts without needing a push.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # ruby-version is omitted on purpose: setup-ruby defaults to reading
          # .ruby-version, and there is no ruby-version-file input.
          bundler-cache: true

      # Retained for its Pages-enablement side effect only. Its `base_path`
      # output is deliberately NOT passed to --baseurl: url/baseurl are pinned
      # in _config.yml so that local output and CI output are byte-identical,
      # which is what makes a parity diff meaningful.
      - uses: actions/configure-pages@v6

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - uses: actions/upload-pages-artifact@v5
        # defaults to path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
