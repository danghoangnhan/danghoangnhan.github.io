name: CI

# Build-only check for pull requests. Deliberately separate from pages.yml: fork
# PRs get a read-only token and cannot do `pages: write`, so keeping deployment
# out of this workflow means external contributions never fail on permissions.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # ruby-version is omitted on purpose: setup-ruby defaults to reading
          # .ruby-version, and there is no ruby-version-file input.
          bundler-cache: true

      # Runs before the build, because it is the cheapest check and the one that
      # catches the class of bug this site actually had. `jekyll build` is
      # perfectly happy with an empty post, a duplicated title, or 25 posts
      # sharing one meta description — see the header of the script.
      - name: Content lint
        run: ruby script/lint-content.rb

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Link check
        # Blocking. It is worth keeping strict: enforce-https is what caught the
        # http://disqus.com links, and the empty-href check caught a 404.html
        # anchor that broke when baseurl changed from "/" to "".
        #
        # --ignore-missing-alt is NOT set. It used to be, and it was suppressing
        # exactly the errors that mattered: the /about/ portrait and both featured
        # thumbnails shipped for years with no alt text and a green build.
        #
        # --disable-external stays, because the run has to be hermetic — but note
        # it skips every absolute_url on the page, which is most of the homepage.
        # The scheduled job in external-links.yml is what actually checks those.
        #
        # Note this cannot be run on Windows — html-proofer binds libcurl via
        # ethon and there is no libcurl.dll, so this job is the only place the
        # check actually runs.
        run: |
          gem install html-proofer --no-document
          htmlproofer ./_site \
            --disable-external \
            --allow-hash-href

      - name: Accessibility check
        # pa11y-ci runs axe and HTML CodeSniffer against the built site over a
        # local static server. One page per template — the homepage, a post, a
        # standalone page and a listing — because a template defect appears on
        # every page using it, and four is enough to see all four templates.
        #
        # Two additions for pagination. /page2/ is not a fifth template but a second
        # render state of the home one: paginator.page == 1 gates the Featured block
        # and the de-duplication, so page 2 takes Liquid branches page 1 never runs,
        # and it is the only page whose <h1> and active nav item depend on the
        # is_home assign in _layouts/default.html holding. /category/cnn/ is here
        # because _layouts/archive.html changed generator underneath it, from
        # jekyll-archives to jekyll-paginate-v2's autopages.
        #
        # This is the check that would have caught the missing landmarks, the
        # unnamed share buttons, the iframe with no title and the 3.23:1 body
        # text, none of which html-proofer can see.
        run: |
          npm install --no-save pa11y-ci@4 http-server@14
          npx http-server ./_site -p 4000 --silent &
          npx wait-on http://127.0.0.1:4000 --timeout 30000 || sleep 5
          URLS="http://127.0.0.1:4000/ \
                http://127.0.0.1:4000/page2/ \
                http://127.0.0.1:4000/poolinglayers/ \
                http://127.0.0.1:4000/about \
                http://127.0.0.1:4000/topics/ \
                http://127.0.0.1:4000/category/cnn/"

          # The default reporter names the rule and the element but not the
          # measured value, so a contrast failure tells you which link is wrong and
          # nothing about why. On failure, re-run with the JSON reporter, which
          # carries axe's full message — the actual ratio and the two colours it
          # compared. Without this the only way to debug a red build is to guess
          # and push again.
          if ! npx pa11y-ci --config .pa11yci.json $URLS; then
            echo "::group::Full pa11y JSON (contains the measured values)"
            npx pa11y-ci --config .pa11yci.json --reporter json $URLS || true
            echo "::endgroup::"
            exit 1
          fi
