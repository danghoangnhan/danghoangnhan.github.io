name: CI

# Build-only check for pull requests. Deliberately separate from pages.yml: fork
# PRs get a read-only token and cannot do `pages: write`, so keeping deployment
# out of this workflow means external contributions never fail on permissions.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          # ruby-version is omitted on purpose: setup-ruby defaults to reading
          # .ruby-version, and there is no ruby-version-file input.
          bundler-cache: true

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Link check
        # Blocking. It is worth keeping strict: enforce-https is what caught the
        # http://disqus.com links, and the empty-href check caught a 404.html
        # anchor that broke when baseurl changed from "/" to "".
        #
        # Note this cannot be run on Windows — html-proofer binds libcurl via
        # ethon and there is no libcurl.dll, so this job is the only place the
        # check actually runs.
        run: |
          gem install html-proofer --no-document
          htmlproofer ./_site \
            --disable-external \
            --allow-hash-href \
            --ignore-missing-alt
