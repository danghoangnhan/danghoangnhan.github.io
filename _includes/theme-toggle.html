<button
  type="button"
  id="theme-toggle"
  class="theme-toggle"
  aria-pressed="false"
  aria-label="Switch to dark theme"
  title="Toggle light and dark theme"
>
  <i class="fa-solid fa-sun theme-icon-light" aria-hidden="true"></i>
  <i class="fa-solid fa-moon theme-icon-dark" aria-hidden="true"></i>
</button>
